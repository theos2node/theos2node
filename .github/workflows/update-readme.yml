name: Update profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # Mondays at 09:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check updater
        run: python3 -m py_compile scripts/update_readme.py
      - name: Update README sections
        env:
          APP_STORE_APP_ID: "6753273634"
          APP_STORE_COUNTRY: ph
        run: |
          python3 scripts/update_readme.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh App Store details"
          git push
